<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedLeave | مجمع بدية الصحي</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Tajawal', -apple-system, sans-serif;
      background:linear-gradient(135deg,#f0f6fc,#e2ecf5);
      min-height:100vh; padding:1.5rem; color:#1e293b;
      display:flex; justify-content:center; align-items:flex-start;
    }
    .app-container {
      max-width:1100px; width:100%; background:rgba(255,255,255,.95);
      backdrop-filter:blur(20px); border-radius:2rem; padding:2rem;
      box-shadow:0 25px 50px -12px rgba(0,0,0,.15);
      display:flex; flex-direction:column; gap:1.5rem;
    }
    .top-section { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:1rem; }
    .logo-area { display:flex; align-items:center; gap:.7rem; }
    .logo-icon {
      background:linear-gradient(135deg,#0ea5e9,#0284c7); color:#fff;
      width:48px; height:48px; border-radius:16px;
      display:flex; align-items:center; justify-content:center; font-size:1.5rem;
      box-shadow:0 12px 20px -10px rgba(14,165,233,.4);
    }
    .logo-text { font-size:1.7rem; font-weight:700;
      background:linear-gradient(135deg,#0369a1,#0c4a6e);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    }
    .logo-text span { font-weight:500; }
    .login-card {
      background:#f8fafc; border-radius:2rem; padding:.8rem 1.5rem;
      display:flex; flex-wrap:wrap; align-items:center; gap:.7rem;
      box-shadow:0 4px 12px rgba(0,0,0,.05); border:1px solid #e2e8f0;
    }
    .input-group {
      display:flex; align-items:center; gap:.5rem;
      background:#fff; border-radius:2.5rem; padding:.4rem 1rem;
      border:1px solid #dce3eb;
    }
    .input-group i { color:#5b7c9b; font-size:.9rem; }
    .input-group input {
      border:none; background:transparent; padding:.5rem .2rem;
      font-size:.9rem; font-weight:500; width:130px; outline:none; color:#0f172a;
      font-family: 'Tajawal', sans-serif;
    }
    .btn {
      border:none; border-radius:2.5rem; padding:.6rem 1.5rem;
      font-weight:600; font-size:.9rem; cursor:pointer;
      background:linear-gradient(135deg,#0ea5e9,#0284c7); color:#fff;
      box-shadow:0 8px 18px -6px rgba(14,165,233,.5);
      display:inline-flex; align-items:center; gap:.4rem; transition:.3s;
      font-family: 'Tajawal', sans-serif;
    }
    .btn:hover { transform:translateY(-2px); }
    .btn-outline { background:#fff; color:#0369a1; border:1px solid #cbd5e1; box-shadow:none; }
    .btn-sm { padding:.4rem 1rem; font-size:.8rem; }
    .user-welcome { display:flex; align-items:center; gap:.7rem;
      background:#e0f2fe; border-radius:3rem; padding:.3rem 1.2rem .3rem .3rem; }
    .avatar {
      background:linear-gradient(135deg,#0ea5e9,#0284c7); color:#fff;
      width:36px; height:36px; border-radius:50%;
      display:flex; align-items:center; justify-content:center; font-weight:700;
    }
    .status-bar {
      display:flex; justify-content:space-between; align-items:center;
      font-size:.8rem; background:#f8fafc; border-radius:1rem; padding:.5rem 1rem;
    }
    .status-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;background:#22c55e;}
    .status-dot.syncing{background:#f59e0b;}
    .status-dot.offline{background:#ef4444;}
    .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:1rem; margin-bottom: 1rem;}
    .stat-card {
      background:#f9fcff; border-radius:1.5rem; padding:1.2rem;
      box-shadow:0 8px 20px -8px rgba(0,32,64,.08); border:1px solid #eef3f9;
      display:flex; align-items:center; justify-content:space-between;
    }
    .stat-info h4 { font-size:.8rem; text-transform:uppercase; color:#51718c; margin-bottom:.3rem; }
    .stat-number {
      font-size:2rem; font-weight:700;
      background:linear-gradient(135deg,#0369a1,#0c4a6e);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    }
    .stat-icon { font-size:1.8rem; color:#0ea5e9; opacity:.5; }
    
    /* تنسيقات التقويم */
    .calendar-controls { display:flex; align-items:center; justify-content:space-between; background:#f0f4fa; border-radius:2.5rem; padding:.5rem 1.2rem; }
    .calendar-title { font-weight:700; font-size:1.2rem; color:#0c4a6e; }
    .nav-arrow { background:#fff; border:none; border-radius:50%; width:36px; height:36px; cursor:pointer; font-size:1rem; box-shadow:0 5px 12px rgba(0,0,0,.05); display:flex; align-items:center; justify-content:center; }
    .nav-arrow:disabled { opacity:.3; cursor:not-allowed; }
    
    .calendar-grid { display:grid; grid-template-columns: repeat(7, 1fr); gap: 0.5rem; background: #fff; padding: 1rem; border-radius: 1.5rem; border: 1px solid #e2e8f0; }
    .day-name { text-align: center; font-weight: 700; color: #64748b; font-size: 0.85rem; padding-bottom: 0.5rem; }
    .calendar-day { height: 50px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 600; background: #f8fafc; border: 1px solid #e2e8f0; position: relative; cursor: pointer; transition: 0.2s; }
    .calendar-day:hover:not(.empty):not(.booked) { background: #e0f2fe; border-color: #0ea5e9; }
    .calendar-day.empty { background: transparent; border: none; cursor: default; }
    .calendar-day.today { border: 2px solid #0ea5e9; }
    
    /* ألوان أنواع الإجازات */
    .calendar-day.booked { color: #fff; cursor: not-allowed; }
    .calendar-day.type-OFF { background: #3b82f6; border-color: #2563eb; } /* أزرق للأوف */
    .calendar-day.type-ANNUAL { background: #10b981; border-color: #059669; } /* أخضر للسنوية */
    .calendar-day.type-SHIFT { background: #f59e0b; border-color: #d97706; } /* برتقالي للمناوبة */
    .calendar-day.type-SICK { background: #ef4444; border-color: #dc2626; } /* أحمر للمرضية */

    .leave-selector { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .leave-btn { padding: 0.5rem 1rem; border-radius: 2rem; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; font-family: 'Tajawal'; font-weight: 600; transition: 0.2s; }
    .leave-btn.active { background: #0ea5e9; color: #fff; border-color: #0ea5e9; }

    .booked-list { background:#f8fafc; border-radius:1.5rem; padding:1rem 1.5rem; border:1px solid #e9f0f7; max-height:200px; overflow-y:auto; margin-top: 1rem; }
    .booked-item { display:flex; align-items:center; justify-content:space-between; padding:.6rem 0; border-bottom:1px solid #e2e8f0; font-size: 0.9rem; }
    .booked-item:last-child { border-bottom:none; }
    .badge { padding:.2rem .6rem; border-radius:1rem; font-size:.75rem; font-weight: 700; color: #fff;}
    .badge.OFF { background: #3b82f6; }
    .badge.ANNUAL { background: #10b981; }
    .badge.SHIFT { background: #f59e0b; }
    .badge.SICK { background: #ef4444; }

    .delete-btn { color:#ef4444; cursor:pointer; opacity:.7; background:none; border:none; font-size:1rem; }
    .delete-btn:hover { opacity:1; }

    @media (max-width:650px) {
      .app-container { padding:1.2rem; }
      .login-card { flex-direction:column; align-items:stretch; }
      .calendar-day { height: 40px; font-size: 0.8rem; }
    }
  </style>
</head>
<body>
<div class="app-container">
  <div class="top-section">
    <div class="logo-area">
      <div class="logo-icon"><i class="fas fa-calendar-check"></i></div>
      <div class="logo-text">Med<span>Leave</span></div>
    </div>
    <div id="loginPanel" class="login-card">
      <div class="input-group">
        <i class="fas fa-id-badge"></i>
        <input type="text" id="staffInput" placeholder="الرقم الوظيفي / ADMIN">
      </div>
      <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="passInput" placeholder="كلمة المرور (للمدير)">
      </div>
      <button class="btn" id="loginBtn"><i class="fas fa-right-to-bracket"></i> دخول</button>
    </div>
    <div id="userDisplay" style="display:none;" class="user-welcome">
      <div class="avatar" id="avatarLetter">?</div>
      <span id="displayName">-</span>
      <button class="btn btn-outline btn-sm" id="logoutBtn" title="تسجيل خروج"><i class="fas fa-sign-out-alt"></i></button>
    </div>
  </div>

  <div class="status-bar">
    <span><span class="status-dot" id="statusDot"></span><span id="statusText">جاهز</span></span>
    <span style="font-size:.7rem;color:#94a3b8;">📊 Google Sheets</span>
  </div>

  <div id="notifArea"></div>

  <div id="dashboardContent" style="display:none;">
    
    <!-- الإحصائيات (للطبيب فقط) -->
    <div class="stats-grid" id="doctorStats">
      <div class="stat-card">
        <div class="stat-info"><h4>أيام الأوف المحجوزة</h4><div class="stat-number" id="bookedCount">0</div></div>
        <i class="fas fa-bookmark stat-icon"></i>
      </div>
      <div class="stat-card">
        <div class="stat-info"><h4>المتبقي من الأوف</h4><div class="stat-number" id="remainingCount">0</div></div>
        <i class="fas fa-hourglass-half stat-icon"></i>
      </div>
    </div>

    <div class="calendar-controls">
      <button class="nav-arrow" id="nextMonthBtn"><i class="fas fa-chevron-right"></i></button>
      <div class="calendar-title" id="monthTitle">-</div>
      <button class="nav-arrow" id="prevMonthBtn"><i class="fas fa-chevron-left"></i></button>
    </div>

    <!-- اختيار نوع الإجازة (للطبيب فقط) -->
    <div class="leave-selector" id="leaveTypeSelector">
      <button class="leave-btn active" data-type="OFF">أوف (يوم)</button>
      <button class="leave-btn" data-type="ANNUAL">إجازة سنوية</button>
      <button class="leave-btn" data-type="SHIFT">مناوبة</button>
      <button class="leave-btn" data-type="SICK">إجازة مرضية</button>
    </div>

    <!-- التقويم الشهري -->
    <div class="calendar-grid" id="calendarGrid">
      <!-- سيتم بناء التقويم هنا بالجافاسكريبت -->
    </div>

    <!-- قائمة الطلبات أسفل التقويم -->
    <h4 style="font-weight:600; margin-top: 1rem;"><i class="fas fa-list-check"></i> الطلبات المسجلة:</h4>
    <div class="booked-list" id="bookedListContainer"></div>

    <!-- أزرار المدير -->
    <div id="adminActions" style="display:none; gap:1rem; flex-wrap:wrap; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #e2e8f0;">
      <button class="btn btn-outline" id="viewAnnualBtn"><i class="fas fa-calendar-alt"></i> التقويم السنوي (لإجازات جميع الأطباء)</button>
      <button class="btn btn-outline" id="exportBtn"><i class="fas fa-file-excel"></i> تصدير كشف Excel</button>
    </div>

    <!-- شاشة التقويم السنوي للمدير -->
    <div id="annualView" style="display:none; margin-top: 1rem;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
        <h3 style="color: #0c4a6e;">الإجازات السنوية لعام <span id="annualYear">2026</span></h3>
        <button class="btn btn-outline btn-sm" id="closeAnnualBtn">إغلاق</button>
      </div>
      <div class="booked-list" id="annualListContainer" style="max-height: 400px;"></div>
    </div>

  </div>
</div>

<script>
(function(){
  const API_URL = 'https://script.google.com/macros/s/AKfycbz1m8Pk8t_wopbtFhV06UL9iq4oqXE4h7Q3COkrgTlcUTCLzIAqHozp_qJ5YrFq4lub/exec';

  let session = null;
  let viewDate = new Date();
  let selectedType = 'OFF'; // OFF, ANNUAL, SHIFT, SICK
  let dashboardData = { bookings: [], minDays: 2, maxDays: 3 };
  let currentYear = viewDate.getFullYear();

  const typeNames = {
    'OFF': 'أوف',
    'ANNUAL': 'إجازة سنوية',
    'SHIFT': 'مناوبة',
    'SICK': 'إجازة مرضية'
  };

  function getYM(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
  
  function nextMonth(){
    const n=new Date(); let y=n.getFullYear(), m=n.getMonth()+2;
    if(m>12){m-=12;y++;} return new Date(y,m-1,1);
  }
  const MAX_MONTH = nextMonth();

  function setStatus(s){
    const dot=document.getElementById('statusDot'), txt=document.getElementById('statusText');
    dot.className='status-dot '+(s==='syncing'?'syncing':s==='offline'?'offline':'');
    txt.textContent = s==='syncing'?'جاري المزامنة...':s==='offline'?'غير متصل':'متصل بالخادم';
  }

  async function api(action, payload){
    setStatus('syncing');
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, ...payload }),
        redirect: 'follow'
      });
      const text = await res.text(); 
      let data;
      try { data = JSON.parse(text); } catch(e) { throw new Error("Invalid JSON"); }
      setStatus('online');
      return data;
    } catch(e){
      setStatus('offline');
      alert('فشل الاتصال بالخادم.');
      return { ok:false, error: e.message };
    }
  }

  /* ---------- Login ---------- */
  document.getElementById('loginBtn').onclick = async () => {
    const staffNo = document.getElementById('staffInput').value.trim();
    const password = document.getElementById('passInput').value;
    if(!staffNo) return alert('الرجاء إدخال الرقم الوظيفي');

    const r = await api('login', { staffNo, password });
    if(!r || !r.ok) return alert(r?.error || 'فشل تسجيل الدخول');

    session = r;
    document.getElementById('loginPanel').style.display='none';
    document.getElementById('userDisplay').style.display='flex';
    document.getElementById('displayName').textContent = r.name;
    document.getElementById('avatarLetter').textContent = (r.name||'?').charAt(0).toUpperCase();
    document.getElementById('dashboardContent').style.display='block';

    if (r.role === 'admin') {
      document.getElementById('adminActions').style.display = 'flex';
      document.getElementById('doctorStats').style.display = 'none';
      document.getElementById('leaveTypeSelector').style.display = 'none';
    } else {
      document.getElementById('adminActions').style.display = 'none';
      document.getElementById('doctorStats').style.display = 'grid';
      document.getElementById('leaveTypeSelector').style.display = 'flex';
    }

    if(r.notifications && r.notifications.length) renderNotifications(r.notifications);
    else document.getElementById('notifArea').innerHTML='';

    viewDate = new Date(MAX_MONTH);
    await loadDashboard();
  };

  document.getElementById('logoutBtn').onclick = () => {
    session=null;
    document.getElementById('loginPanel').style.display='flex';
    document.getElementById('userDisplay').style.display='none';
    document.getElementById('dashboardContent').style.display='none';
    document.getElementById('annualView').style.display='none';
    document.getElementById('notifArea').innerHTML='';
  };

  function renderNotifications(list){
    const area = document.getElementById('notifArea');
    area.innerHTML = `<div class="notif-banner" style="background:#fef3c7; padding:1rem; border-radius:1rem; margin-bottom:1rem;">
      <strong><i class="fas fa-bell"></i> لديك ${list.length} إشعار:</strong>
      <button id="markReadBtn" style="float:left; background:none; border:none; color:#92400e; cursor:pointer; font-weight:600;">تحديد كمقروء</button>
      <ul style="margin-top:.5rem;padding-right:1.2rem;">
        ${list.map(n=>`<li>${n.message}</li>`).join('')}
      </ul>
    </div>`;
    document.getElementById('markReadBtn').onclick = async ()=>{
      await api('markNotificationsRead', { staffNo: session.staffNo });
      area.innerHTML='';
    };
  }

  /* ---------- Dashboard & Calendar ---------- */
  async function loadDashboard(){
    if(!session) return;
    const ym = getYM(viewDate);
    const r = await api('getDashboard', { staffNo: session.staffNo, yearMonth: ym, role: session.role });
    if(!r.ok) return alert(r.error);
    
    dashboardData = r;
    currentYear = viewDate.getFullYear();
    renderCalendar();
    renderList();
  }

  function renderCalendar(){
    const grid = document.getElementById('calendarGrid');
    const year = viewDate.getFullYear();
    const month = viewDate.getMonth();
    
    const label = viewDate.toLocaleString('ar-OM',{month:'long',year:'numeric'});
    document.getElementById('monthTitle').textContent = label;

    const firstDay = new Date(year, month, 1).getDay(); // 0=Sunday
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    
    // تعديل لتبدأ الأسبوع من الأحد
    const startOffset = firstDay; 

    const dayNames = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
    
    let html = dayNames.map(d => `<div class="day-name">${d}</div>`).join('');
    for(let i=0; i<startOffset; i++) html += `<div class="calendar-day empty"></div>`;

    // تجميع الحجوزات لهذا الشهر حسب اليوم
    const monthBookings = {};
    dashboardData.bookings.forEach(b => {
      if(!monthBookings[b.day]) monthBookings[b.day] = [];
      monthBookings[b.day].push(b);
    });

    const today = new Date();
    const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;

    for(let d=1; d<=daysInMonth; d++){
      const dayBookings = monthBookings[d] || [];
      let cls = 'calendar-day';
      let content = d;
      let title = '';

      if (session.role === 'doctor') {
        // الطبيب يرى حجوزاته فقط (تمت فلترتها في الباكند)
        if (dayBookings.length > 0) {
          const b = dayBookings[0]; // يفترض حجز واحد في اليوم
          cls += ` booked type-${b.leaveType}`;
          title = typeNames[b.leaveType];
        }
      } else {
        // المدير يرى كل الحجوزات (مفصولة بفواصل أو ألوان)
        if (dayBookings.length > 0) {
          cls += ' booked';
          // لون افتراضي للمدير
          cls += ' type-OFF'; 
          title = dayBookings.map(b => `${b.doctorName} (${typeNames[b.leaveType]})`).join(' | ');
          content = `<span style="font-size:0.7rem; line-height:1.1; overflow:hidden; text-align:center;">${d}<br><span style="font-size:0.6rem;">${dayBookings.length} طلبات</span></span>`;
        }
      }

      if(isCurrentMonth && d === today.getDate()) cls += ' today';

      html += `<div class="${cls}" title="${title}" data-day="${d}">${content}</div>`;
    }

    grid.innerHTML = html;

    // إضافة حدث النقر (للأطباء فقط)
    if (session.role === 'doctor') {
      grid.querySelectorAll('.calendar-day:not(.empty):not(.booked)').forEach(cell => {
        cell.onclick = async () => {
          const d = +cell.dataset.day;
          if(!confirm(`هل تريد تسجيل "${typeNames[selectedType]}" في يوم ${d}؟`)) return;
          const ym = getYM(viewDate);
          const r = await api('bookDay', {
            staffNo: session.staffNo, doctorName: session.name, yearMonth: ym, day: d, leaveType: selectedType
          });
          if(r.ok){ await loadDashboard(); }
          else alert(r.error);
        };
      });
    }
  }

  function renderList(){
    const list = document.getElementById('bookedListContainer');
    const all = dashboardData.bookings || [];

    if (session.role === 'doctor') {
      const offCount = all.filter(b => b.leaveType === 'OFF').length;
      const maxD = dashboardData.maxDays ?? 3;
      document.getElementById('bookedCount').textContent = offCount;
      document.getElementById('remainingCount').textContent = Math.max(0, maxD - offCount);
    }

    if(!all.length){
      list.innerHTML = '<div style="color:#64748b;text-align:center;padding:1rem;">لا توجد طلبات مسجلة هذا الشهر.</div>';
      return;
    }

    list.innerHTML = [...all].sort((a,b)=>a.day-b.day).map(b=>`
      <div class="booked-item">
        <span>
          <span class="badge ${b.leaveType}">${typeNames[b.leaveType]}</span>
          <span style="color:#334155;margin-right:.5rem; font-weight:700;">يوم ${b.day}</span>
          ${session.role === 'admin' ? `<span style="color:#64748b; font-size:0.85rem; margin-right:0.5rem;">- ${b.doctorName}</span>` : ''}
        </span>
        ${(session.role==='doctor' || session.role==='admin')
          ? `<button class="delete-btn" data-id="${b.id}" title="حذف"><i class="fas fa-trash-can"></i></button>` : ''}
      </div>`).join('');

    list.querySelectorAll('.delete-btn').forEach(btn=>{
      btn.onclick = async ()=>{
        if(!confirm('هل أنت متأكد من إلغاء هذا الطلب؟')) return;
        const id = btn.dataset.id;
        const r = session.role==='admin'
          ? await api('adminUpdateBooking', { bookingId:id, subAction:'delete' })
          : await api('cancelBooking', { id, staffNo: session.staffNo });
        if(r.ok) await loadDashboard();
        else alert(r.error);
      };
    });
  }

  /* ---------- Events ---------- */
  document.querySelectorAll('.leave-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.leave-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedType = btn.dataset.type;
    };
  });

  document.getElementById('prevMonthBtn').onclick = ()=>{
    const d = new Date(viewDate); d.setMonth(d.getMonth()-1);
    if(d < MAX_MONTH) return;
    viewDate = d; loadDashboard();
  };
  document.getElementById('nextMonthBtn').onclick = ()=>{
    const d = new Date(viewDate); d.setMonth(d.getMonth()+1);
    if(d > MAX_MONTH) return;
    viewDate = d; loadDashboard();
  };

  /* ---------- Admin Annual View ---------- */
  document.getElementById('viewAnnualBtn').onclick = async () => {
    document.getElementById('annualView').style.display = 'block';
    document.getElementById('annualYear').textContent = currentYear;
    const list = document.getElementById('annualListContainer');
    list.innerHTML = '<div style="text-align:center; padding:1rem;">جاري التحميل...</div>';

    const r = await api('getAnnualLeaves', { year: currentYear });
    if (!r.ok) {
      list.innerHTML = `<div style="color:red; padding:1rem;">${r.error}</div>`;
      return;
    }

    if (!r.annualLeaves || r.annualLeaves.length === 0) {
      list.innerHTML = '<div style="text-align:center; padding:1rem; color:#64748b;">لا توجد إجازات سنوية مسجلة لهذا العام.</div>';
      return;
    }

    // تجميع حسب الطبيب
    const byDoctor = {};
    r.annualLeaves.forEach(b => {
      if(!byDoctor[b.staffNo]) byDoctor[b.staffNo] = { name: b.doctorName, days: [] };
      byDoctor[b.staffNo].days.push(b.day + '/' + b.yearMonth.split('-')[1]);
    });

    let html = '';
    for (const staffNo in byDoctor) {
      html += `<div class="booked-item" style="padding: 1rem; background: #fff; margin-bottom: 0.5rem; border-radius: 1rem; border: 1px solid #e2e8f0;">
        <div>
          <strong style="color: #0c4a6e;">${byDoctor[staffNo].name}</strong> <span style="color:#94a3b8; font-size:0.8rem;">#${staffNo}</span><br>
          <span style="color: #059669; font-size: 0.9rem;">الأيام: ${byDoctor[staffNo].days.join('، ')}</span>
        </div>
        <div style="background: #d1fae5; color: #059669; padding: 0.5rem 1rem; border-radius: 1rem; font-weight: 700;">
          ${byDoctor[staffNo].days.length} أيام
        </div>
      </div>`;
    }
    list.innerHTML = html;
  };

  document.getElementById('closeAnnualBtn').onclick = () => {
    document.getElementById('annualView').style.display = 'none';
  };

  document.getElementById('exportBtn').onclick = async ()=>{
    const r = await api('exportExcel', { yearMonth: getYM(viewDate) });
    if(r.ok) window.open(r.downloadUrl, '_blank');
    else alert(r.error||'فشل التصدير');
  };

  setStatus('online');
})();
</script>
</body>
</html>
