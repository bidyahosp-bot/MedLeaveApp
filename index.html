<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedLeave | مجمع بدية الصحي</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Tajawal', -apple-system, sans-serif;
      background:linear-gradient(135deg,#f0f6fc,#e2ecf5);
      min-height:100vh; padding:1.5rem; color:#1e293b;
      display:flex; justify-content:center; align-items:flex-start;
    }
    .app-container {
      max-width:1100px; width:100%; background:rgba(255,255,255,.95);
      backdrop-filter:blur(20px); border-radius:2rem; padding:2rem;
      box-shadow:0 25px 50px -12px rgba(0,0,0,.15);
      display:flex; flex-direction:column; gap:1.5rem;
    }
    .top-section { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:1rem; }
    .logo-area { display:flex; align-items:center; gap:.7rem; }
    .logo-icon {
      background:linear-gradient(135deg,#0ea5e9,#0284c7); color:#fff;
      width:48px; height:48px; border-radius:16px;
      display:flex; align-items:center; justify-content:center; font-size:1.5rem;
      box-shadow:0 12px 20px -10px rgba(14,165,233,.4);
    }
    .logo-text { font-size:1.7rem; font-weight:700;
      background:linear-gradient(135deg,#0369a1,#0c4a6e);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    }
    .logo-text span { font-weight:500; }
    .login-card {
      background:#f8fafc; border-radius:2rem; padding:.8rem 1.5rem;
      display:flex; flex-wrap:wrap; align-items:center; gap:.7rem;
      box-shadow:0 4px 12px rgba(0,0,0,.05); border:1px solid #e2e8f0;
    }
    .input-group {
      display:flex; align-items:center; gap:.5rem;
      background:#fff; border-radius:2.5rem; padding:.4rem 1rem;
      border:1px solid #dce3eb;
    }
    .input-group i { color:#5b7c9b; font-size:.9rem; }
    .input-group input {
      border:none; background:transparent; padding:.5rem .2rem;
      font-size:.9rem; font-weight:500; width:130px; outline:none; color:#0f172a;
      font-family: 'Tajawal', sans-serif;
    }
    .btn {
      border:none; border-radius:2.5rem; padding:.6rem 1.5rem;
      font-weight:600; font-size:.9rem; cursor:pointer;
      background:linear-gradient(135deg,#0ea5e9,#0284c7); color:#fff;
      box-shadow:0 8px 18px -6px rgba(14,165,233,.5);
      display:inline-flex; align-items:center; gap:.4rem; transition:.3s;
      font-family: 'Tajawal', sans-serif;
    }
    .btn:hover { transform:translateY(-2px); }
    .btn-outline { background:#fff; color:#0369a1; border:1px solid #cbd5e1; box-shadow:none; }
    .btn-sm { padding:.4rem 1rem; font-size:.8rem; }
    .user-welcome { display:flex; align-items:center; gap:.7rem;
      background:#e0f2fe; border-radius:3rem; padding:.3rem 1.2rem .3rem .3rem; }
    .avatar {
      background:linear-gradient(135deg,#0ea5e9,#0284c7); color:#fff;
      width:36px; height:36px; border-radius:50%;
      display:flex; align-items:center; justify-content:center; font-weight:700;
    }
    .status-bar {
      display:flex; justify-content:space-between; align-items:center;
      font-size:.8rem; background:#f8fafc; border-radius:1rem; padding:.5rem 1rem;
    }
    .status-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;background:#22c55e;}
    .status-dot.syncing{background:#f59e0b;}
    .status-dot.offline{background:#ef4444;}
    .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:1rem; }
    .stat-card {
      background:#f9fcff; border-radius:1.5rem; padding:1.2rem;
      box-shadow:0 8px 20px -8px rgba(0,32,64,.08); border:1px solid #eef3f9;
      display:flex; align-items:center; justify-content:space-between;
    }
    .stat-info h4 { font-size:.8rem; text-transform:uppercase; color:#51718c; margin-bottom:.3rem; }
    .stat-number {
      font-size:2rem; font-weight:700;
      background:linear-gradient(135deg,#0369a1,#0c4a6e);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    }
    .stat-icon { font-size:1.8rem; color:#0ea5e9; opacity:.5; }
    .month-selector {
      display:flex; align-items:center; justify-content:space-between;
      background:#f0f4fa; border-radius:2.5rem; padding:.5rem 1.2rem;
    }
    .month-title { font-weight:700; font-size:1.2rem; color:#0c4a6e; }
    .nav-arrow {
      background:#fff; border:none; border-radius:50%; width:36px; height:36px;
      cursor:pointer; font-size:1rem; box-shadow:0 5px 12px rgba(0,0,0,.05);
      display:flex; align-items:center; justify-content:center;
    }
    .nav-arrow:disabled { opacity:.3; cursor:not-allowed; }
    .booked-list {
      background:#f8fafc; border-radius:1.5rem; padding:1rem 1.5rem;
      border:1px solid #e9f0f7; max-height:250px; overflow-y:auto;
    }
    .booked-item {
      display:flex; align-items:center; justify-content:space-between;
      padding:.6rem 0; border-bottom:1px solid #e2e8f0;
    }
    .booked-item:last-child { border-bottom:none; }
    .day-badge { background:#dbeafe; color:#1e3a8a; font-weight:700; padding:.3rem .8rem; border-radius:2rem; font-size:.85rem; }
    .delete-btn { color:#ef4444; cursor:pointer; opacity:.7; background:none; border:none; font-size:1rem; }
    .delete-btn:hover { opacity:1; }
    .action-row { display:flex; flex-wrap:wrap; align-items:center; gap:1rem; }
    .day-picker { display:flex; flex-wrap:wrap; gap:.4rem; background:#fff; padding:.8rem; border-radius:1.5rem; border:1px solid #dce5ef; }
    .day-cell {
      width:36px; height:36px; border-radius:10px;
      display:flex; align-items:center; justify-content:center;
      font-weight:600; background:#f1f5f9; cursor:pointer; font-size:.85rem; transition:.2s;
    }
    .day-cell:hover:not(.booked):not(.disabled) { background:#e0f2fe; transform:scale(1.1); }
    .day-cell.selected { background:#0ea5e9; color:#fff; transform:scale(1.1); }
    .day-cell.booked { background:#fecaca; color:#7f1d1d; cursor:not-allowed; text-decoration:line-through; }
    .day-cell.disabled { opacity:.5; pointer-events:none; }
    .message { font-size:.85rem; padding:.5rem 1rem; border-radius:1rem; display:none; }
    .message.show { display:inline-block; }
    .message.success { color:#059669; background:#d1fae5; }
    .message.error { color:#dc2626; background:#fee2e2; }
    .notif-banner { background:#fef3c7; border:1px solid #fcd34d; border-radius:1rem; padding:.8rem 1rem; font-size:.85rem; margin-bottom: 1rem; }
    .notif-banner button { background:none; border:none; color:#92400e; cursor:pointer; float:left; font-weight:600; }
    @media (max-width:650px) {
      .app-container { padding:1.2rem; }
      .login-card { flex-direction:column; align-items:stretch; }
    }
  </style>
</head>
<body>
<div class="app-container">
  <div class="top-section">
    <div class="logo-area">
      <div class="logo-icon"><i class="fas fa-calendar-check"></i></div>
      <div class="logo-text">Med<span>Leave</span></div>
    </div>
    <div id="loginPanel" class="login-card">
      <div class="input-group">
        <i class="fas fa-id-badge"></i>
        <input type="text" id="staffInput" placeholder="الرقم الوظيفي / ADMIN">
      </div>
      <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="passInput" placeholder="كلمة المرور (للمدير)">
      </div>
      <button class="btn" id="loginBtn"><i class="fas fa-right-to-bracket"></i> دخول</button>
    </div>
    <div id="userDisplay" style="display:none;" class="user-welcome">
      <div class="avatar" id="avatarLetter">?</div>
      <span id="displayName">-</span>
      <button class="btn btn-outline btn-sm" id="logoutBtn" title="تسجيل خروج"><i class="fas fa-sign-out-alt"></i></button>
    </div>
  </div>

  <div class="status-bar">
    <span><span class="status-dot" id="statusDot"></span><span id="statusText">جاهز</span></span>
    <span style="font-size:.7rem;color:#94a3b8;">📊 Google Sheets</span>
  </div>

  <div id="notifArea"></div>

  <div id="dashboardContent" style="display:none;">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-info"><h4>الشهر الحالي</h4><div class="stat-number" id="currentMonthLabel" style="font-size: 1.4rem;">-</div></div>
        <i class="fas fa-calendar-alt stat-icon"></i>
      </div>
      <div class="stat-card" id="bookedStatCard">
        <div class="stat-info"><h4>الأيام المحجوزة</h4><div class="stat-number" id="bookedCount">0</div></div>
        <i class="fas fa-bookmark stat-icon"></i>
      </div>
      <div class="stat-card" id="remainingStatCard">
        <div class="stat-info"><h4>المتبقي من الأوف</h4><div class="stat-number" id="remainingCount">0</div></div>
        <i class="fas fa-hourglass-half stat-icon"></i>
      </div>
    </div>

    <div class="month-selector">
      <button class="nav-arrow" id="nextMonthBtn"><i class="fas fa-chevron-right"></i></button>
      <div class="month-title" id="monthTitle">-</div>
      <button class="nav-arrow" id="prevMonthBtn"><i class="fas fa-chevron-left"></i></button>
    </div>

    <h4 style="font-weight:600;"><i class="fas fa-list-check"></i> سجل الحجوزات لشهر: <span id="listMonthLabel">-</span></h4>
    <div class="booked-list" id="bookedListContainer"></div>

    <div class="action-row" id="doctorActions">
      <div class="day-picker" id="dayPickerContainer"></div>
      <button class="btn" id="addDayBtn"><i class="fas fa-plus-circle"></i> حجز اليوم</button>
      <span class="message" id="bookingMessage"></span>
    </div>

    <div id="adminActions" style="display:none; gap:1rem; flex-wrap:wrap; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #e2e8f0;">
      <button class="btn btn-outline" id="exportBtn"><i class="fas fa-file-excel"></i> تصدير كشف Excel للمدير</button>
    </div>
  </div>
</div>

<script>
(function(){
  // ⚠️ ضع رابط النشر الخاص بك هنا
  const API_URL = 'https://script.google.com/macros/s/AKfycbz1m8Pk8t_wopbtFhV06UL9iq4oqXE4h7Q3COkrgTlcUTCLzIAqHozp_qJ5YrFq4lub/exec';

  let session = null;
  let viewDate = new Date();
  let selectedDay = null;
  let dashboardData = { bookings: [], myBookings: [], minDays: 2, maxDays: 3, doctors: [] };

  function getYM(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
  
  function nextMonth(){
    const n=new Date(); let y=n.getFullYear(), m=n.getMonth()+2;
    if(m>12){m-=12;y++;} return new Date(y,m-1,1);
  }
  const MAX_MONTH = nextMonth();

  function setStatus(s){
    const dot=document.getElementById('statusDot'), txt=document.getElementById('statusText');
    dot.className='status-dot '+(s==='syncing'?'syncing':s==='offline'?'offline':'');
    txt.textContent = s==='syncing'?'جاري المزامنة...':s==='offline'?'غير متصل':'متصل بالخادم';
  }

  async function api(action, payload){
    setStatus('syncing');
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, ...payload }),
        redirect: 'follow'
      });
      
      const text = await res.text(); 
      let data;
      try {
        data = JSON.parse(text);
      } catch(e) {
        console.error("الرد ليس بصيغة JSON. تأكد من إعدادات النشر:", text);
        throw new Error("Server returned HTML instead of JSON.");
      }
      
      setStatus('online');
      return data;
    } catch(e){
      console.error('[API error]', e);
      setStatus('offline');
      alert('فشل الاتصال بالخادم. تأكد من الإنترنت.');
      return { ok:false, error: e.message };
    }
  }

  /* ---------- Login ---------- */
  document.getElementById('loginBtn').onclick = async () => {
    const staffNo = document.getElementById('staffInput').value.trim();
    const password = document.getElementById('passInput').value;
    if(!staffNo) return alert('الرجاء إدخال الرقم الوظيفي');

    const r = await api('login', { staffNo, password });
    
    if(!r || !r.ok) {
       return alert(r?.error || 'فشل تسجيل الدخول');
    }

    session = r;
    
    // إخفاء شاشة الدخول وإظهار بيانات المستخدم
    document.getElementById('loginPanel').style.display='none';
    document.getElementById('userDisplay').style.display='flex';
    document.getElementById('displayName').textContent = r.name;
    document.getElementById('avatarLetter').textContent = (r.name||'?').charAt(0).toUpperCase();
    
    // إظهار لوحة التحكم
    document.getElementById('dashboardContent').style.display='block';

    // إعداد واجهة المدير
    if (r.role === 'admin') {
      document.getElementById('adminActions').style.display = 'flex';
      document.getElementById('doctorActions').style.display = 'none';
      // إخفاء مربع "المتبقي من الأوف" للمدير لأنه لا يحتاجه
      document.getElementById('remainingStatCard').style.display = 'none';
      document.getElementById('bookedStatCard').style.display = 'none';
    } else {
      // إعداد واجهة الطبيب
      document.getElementById('adminActions').style.display = 'none';
      document.getElementById('doctorActions').style.display = 'flex';
      document.getElementById('remainingStatCard').style.display = 'flex';
      document.getElementById('bookedStatCard').style.display = 'flex';
    }

    if(r.notifications && r.notifications.length){
      renderNotifications(r.notifications);
    } else {
      document.getElementById('notifArea').innerHTML='';
    }

    viewDate = new Date(MAX_MONTH);
    await loadDashboard();
  };

  document.getElementById('logoutBtn').onclick = () => {
    session=null;
    document.getElementById('loginPanel').style.display='flex';
    document.getElementById('userDisplay').style.display='none';
    document.getElementById('dashboardContent').style.display='none';
    document.getElementById('notifArea').innerHTML='';
  };

  /* ---------- Notifications ---------- */
  function renderNotifications(list){
    const area = document.getElementById('notifArea');
    area.innerHTML = `<div class="notif-banner">
      <strong><i class="fas fa-bell"></i> لديك ${list.length} إشعار جديد:</strong>
      <button id="markReadBtn">تحديد كمقروء</button>
      <ul style="margin-top:.5rem;padding-right:1.2rem;">
        ${list.map(n=>`<li>${esc(n.message)}</li>`).join('')}
      </ul>
    </div>`;
    document.getElementById('markReadBtn').onclick = async ()=>{
      await api('markNotificationsRead', { staffNo: session.staffNo });
      area.innerHTML='';
    };
  }

  /* ---------- Dashboard ---------- */
  async function loadDashboard(){
    if(!session) return;
    const ym = getYM(viewDate);
    const r = await api('getDashboard', {
      staffNo: session.staffNo, yearMonth: ym, role: session.role
    });
    if(!r.ok) {
        return alert(r.error);
    }
    dashboardData = r;
    render();
  }

  function render(){
    const all = dashboardData.bookings || [];
    const mine = session.role==='doctor'
      ? all.filter(b=>b.staffNo===session.staffNo)
      : [];
    const cnt = mine.length;
    const maxD = dashboardData.maxDays ?? 3;

    if (session.role === 'doctor') {
      document.getElementById('bookedCount').textContent = cnt;
      document.getElementById('remainingCount').textContent = Math.max(0, maxD - cnt);
    }

    const label = viewDate.toLocaleString('ar-OM',{month:'long',year:'numeric'});
    document.getElementById('currentMonthLabel').textContent = label;
    document.getElementById('monthTitle').textContent = label;
    document.getElementById('listMonthLabel').textContent = label;

    // عرض القائمة
    const list = document.getElementById('bookedListContainer');
    if(!all.length){
      list.innerHTML = '<div style="color:#64748b;text-align:center;padding:1rem;">لا توجد أيام محجوزة هذا الشهر.</div>';
    } else {
      list.innerHTML = [...all].sort((a,b)=>a.day-b.day).map(b=>`
        <div class="booked-item">
          <span>
            <span class="day-badge">يوم ${b.day}</span>
            <span style="color:#334155;margin-right:.5rem;">${esc(b.doctorName)}</span>
            <span style="color:#94a3b8;font-size:.7rem;margin-right:.4rem;">#${esc(b.staffNo)}</span>
          </span>
          ${(session.role==='doctor' && b.staffNo===session.staffNo) || session.role==='admin'
            ? `<button class="delete-btn" data-id="${b.id}" title="حذف"><i class="fas fa-trash-can"></i></button>`
            : ''}
        </div>`).join('');

      list.querySelectorAll('.delete-btn').forEach(btn=>{
        btn.onclick = async ()=>{
          if(!confirm('هل أنت متأكد من إلغاء الحجز؟')) return;
          const id = btn.dataset.id;
          const r = session.role==='admin'
            ? await api('adminUpdateBooking', { bookingId:id, subAction:'delete' })
            : await api('cancelBooking', { id, staffNo: session.staffNo });
          if(r.ok){ await loadDashboard(); }
          else alert(r.error);
        };
      });
    }

    // عرض منتقي الأيام (للأطباء فقط)
    const picker = document.getElementById('dayPickerContainer');
    if(session.role==='doctor'){
      const year = viewDate.getFullYear();
      const month = viewDate.getMonth()+1;
      const dim = new Date(year, month, 0).getDate();
      const myDays = mine.map(b=>b.day);
      let html='';
      for(let d=1; d<=dim; d++){
        let cls='day-cell';
        if(myDays.includes(d)) cls+=' booked';
        else if(all.some(b=>b.day===d)) cls+=' disabled';
        html += `<div class="${cls}" data-day="${d}">${d}</div>`;
      }
      picker.innerHTML = html;
      picker.querySelectorAll('.day-cell:not(.booked):not(.disabled)').forEach(cell=>{
        cell.onclick = function(){
          picker.querySelectorAll('.selected').forEach(e=>e.classList.remove('selected'));
          this.classList.add('selected');
          selectedDay = +this.dataset.day;
        };
      });
    } else {
      picker.innerHTML = ''; // المدير لا يرى منتقي الأيام
    }

    selectedDay = null;
    document.getElementById('prevMonthBtn').disabled = viewDate <= MAX_MONTH;
    document.getElementById('nextMonthBtn').disabled = viewDate >= MAX_MONTH;
  }

  document.getElementById('addDayBtn').onclick = async ()=>{
    if(!selectedDay) return alert('الرجاء اختيار يوم أولاً');
    const ym = getYM(viewDate);
    const r = await api('bookDay', {
      staffNo: session.staffNo, doctorName: session.name, yearMonth: ym, day: selectedDay
    });
    if(r.ok){ alert(`تم حجز يوم ${selectedDay} بنجاح!`); await loadDashboard(); }
    else alert(r.error);
  };

  document.getElementById('prevMonthBtn').onclick = ()=>{
    const d = new Date(viewDate); d.setMonth(d.getMonth()-1);
    if(d < MAX_MONTH) return;
    viewDate = d; loadDashboard();
  };
  document.getElementById('nextMonthBtn').onclick = ()=>{
    const d = new Date(viewDate); d.setMonth(d.getMonth()+1);
    if(d > MAX_MONTH) return;
    viewDate = d; loadDashboard();
  };

  document.getElementById('exportBtn').onclick = async ()=>{
    const r = await api('exportExcel', { yearMonth: getYM(viewDate) });
    if(r.ok) window.open(r.downloadUrl, '_blank');
    else alert(r.error||'فشل التصدير');
  };

  function esc(t){ return String(t).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

  setStatus('online');
})();
</script>
</body>
</html>
