<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedLeave | Bidiya Hospital</title>
  <link rel="icon" href="data:,">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root { 
      --primary: #0ea5e9; --dark: #0f172a; --bg: #f0f6fc; 
      --c-OFF: #64748b; --c-M: #8b5cf6; --c-A: #3b82f6; 
      --c-E: #10b981; --c-N: #f59e0b; --c-CALL: #ec4899; --c-PH: #ef4444;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',sans-serif; background:var(--bg); min-height:100vh; color:var(--dark); }
    
    /* ================= Login Screen Styles ================= */
    #loginScreen {
      display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 2rem;
      background: linear-gradient(135deg, #e0f2fe 0%, #f0f6fc 100%);
    }
    .login-wrapper {
      background: #fff; border-radius: 1.5rem; padding: 3rem; width: 100%; max-width: 500px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1); text-align: center;
    }
    .login-logo { font-size: 2rem; font-weight: 700; color: var(--primary); margin-bottom: 0.5rem; display: flex; justify-content: center; align-items: center; gap: 0.5rem; }
    .login-subtitle { color: #64748b; font-size: 0.9rem; margin-bottom: 2rem; }
    
    .login-section { margin-bottom: 1.5rem; text-align: left; background: #f8fafc; padding: 1.5rem; border-radius: 1rem; border: 1px solid #e2e8f0; }
    .login-section h3 { font-size: 1rem; margin-bottom: 1rem; color: #334155; display: flex; align-items: center; gap: 0.5rem; }
    
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: #475569; }
    .form-group input, .form-group select { width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 0.5rem; font-family: inherit; font-size: 0.95rem; outline: none; }
    .form-group input:focus, .form-group select:focus { border-color: var(--primary); }
    .form-group input:disabled { background-color: #f1f5f9; color: #94a3b8; cursor: not-allowed; }
    
    .btn { padding: 0.75rem 1.5rem; border-radius: 0.5rem; border: none; background: var(--primary); color: #fff; font-weight: 600; cursor: pointer; transition: 0.2s; width: 100%; font-size: 1rem; }
    .btn:hover { background: #0284c7; }
    .btn-admin { background: #0f172a; }
    .btn-admin:hover { background: #334155; }
    
    /* ================= App Layout Styles ================= */
    #appContent { display: none; padding: 1.5rem; }
    .app-container { max-width: 1500px; margin: 0 auto; background: #fff; border-radius: 1.5rem; padding: 2rem; box-shadow: 0 20px 40px rgba(0,0,0,.1); }
    
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 2px solid #f1f5f9; padding-bottom: 1rem; }
    .logo { font-size: 1.5rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 0.5rem; }
    
    .layout-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem; }
    @media(max-width:1000px){ .layout-grid { grid-template-columns: 1fr; } }
    
    .panel { background: #fff; padding: 1.5rem; border-radius: 1rem; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .panel-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 1rem; color: var(--dark); border-bottom: 2px solid #f1f5f9; padding-bottom: 0.5rem; }
    
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.4rem; }
    .day-name { text-align: center; font-weight: 700; font-size: 0.85rem; color: #64748b; margin-bottom: 0.5rem; }
    .cal-day { height: 85px; border-radius: 0.5rem; background: #f8fafc; border: 1px solid #e2e8f0; display: flex; flex-direction: column; align-items: center; padding-top: 0.4rem; cursor: pointer; position: relative; transition: 0.2s; }
    .cal-day:hover { background: #e0f2fe; border-color: var(--primary); }
    .cal-day.today { border: 2px solid var(--primary); }
    
    /* Selection Styles */
    .cal-day.selected-start, .cal-day.selected-end { background: var(--primary) !important; color: #fff; border-color: #0284c7; }
    .cal-day.selected-start .day-num, .cal-day.selected-end .day-num { color: #fff; }
    .cal-day.in-range { background: #e0f2fe; border-color: #bae6fd; }

    .event { width: 90%; font-size: 0.65rem; color: #fff; padding: 0.15rem 0; margin-top: 0.2rem; border-radius: 3px; text-align: center; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    
    /* Event Colors */
    .bg-OFF { background: var(--c-OFF); } .bg-M { background: var(--c-M); } .bg-A { background: var(--c-A); } 
    .bg-E { background: var(--c-E); } .bg-N { background: var(--c-N); } .bg-CALL { background: var(--c-CALL); } .bg-PH { background: var(--c-PH); }

    /* Admin List */
    .admin-list-container { max-height: 600px; overflow-y: auto; }
    .doctor-group { margin-bottom: 1rem; padding: 0.8rem; background: #f8fafc; border-radius: 0.5rem; border-left: 4px solid var(--primary); }
    .doctor-name { font-weight: 700; font-size: 1rem; margin-bottom: 0.5rem; color: #0f172a; }
    .doctor-leaves { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .leave-badge { font-size: 0.8rem; padding: 0.2rem 0.6rem; border-radius: 1rem; background: #e2e8f0; color: #334155; font-weight: 600; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- ================= LOGIN SCREEN ================= -->
<div id="loginScreen">
  <div class="login-wrapper">
    <div class="login-logo"><i class="fas fa-calendar-check"></i> MedLeave</div>
    <div class="login-subtitle">Bidiya Hospital Duty Planner</div>

    <!-- Admin Login -->
    <div class="login-section">
      <h3><i class="fas fa-user-shield"></i> Manager Login</h3>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="adminUser" value="Manager" readonly>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="adminPass" placeholder="Enter password (admin123)">
      </div>
      <button class="btn btn-admin" onclick="loginAdmin()">Login as Manager</button>
    </div>

    <!-- Doctor Login -->
    <div class="login-section" style="margin-bottom: 0;">
      <h3><i class="fas fa-user-md"></i> Doctor Login</h3>
      <div class="form-group">
        <label>Staff ID</label>
        <input type="text" id="doctorId" placeholder="Enter your Staff ID (e.g., 56513)">
      </div>
      <button class="btn" onclick="loginDoctor()">Login as Doctor</button>
    </div>
  </div>
</div>

<!-- ================= APP CONTENT ================= -->
<div id="appContent">
  <div class="app-container">
    <div class="top-bar">
      <div class="logo"><i class="fas fa-calendar-check"></i> MedLeave</div>
      <div style="display: flex; align-items: center; gap: 1rem;">
        <strong id="displayName"></strong>
        <button class="btn" style="width: auto; padding: 0.5rem 1rem; background: #ef4444;" onclick="logout()">Logout</button>
      </div>
    </div>

    <!-- Main Layout -->
    <div class="layout-grid">
      <!-- Calendar Panel -->
      <div class="panel">
        <div class="calendar-header">
          <button class="btn" style="background:#fff; color:#000; border:1px solid #ccc; padding:0.4rem 1rem; width:auto;" onclick="changeMonth(-1)">&lt; Prev</button>
          <h3 id="monthTitle">Month</h3>
          <button class="btn" style="background:#fff; color:#000; border:1px solid #ccc; padding:0.4rem 1rem; width:auto;" onclick="changeMonth(1)">Next &gt;</button>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
        <p style="font-size:0.8rem; color:#64748b; margin-top:1rem;"><i class="fas fa-info-circle"></i> Click start date, then end date to select a range.</p>
      </div>

      <!-- Right Panel: Doctor Form -->
      <div class="panel" id="doctorDutyForm">
        <div class="panel-title">Request Duty Leave</div>
        <div class="form-group">
          <label>Type</label>
          <select id="dutyType">
            <option value="OFF">OFF (Max 3 Days)</option>
            <option value="M">M (Morning)</option>
            <option value="A">A (Afternoon)</option>
            <option value="E">E (Evening)</option>
            <option value="N">N (Night)</option>
            <option value="CALL">CALL</option>
            <option value="PH">PH</option>
          </select>
        </div>
        <div class="form-group"><label>Start Date</label><input type="text" id="dutyStart" readonly placeholder="Click Calendar"></div>
        <div class="form-group"><label>End Date</label><input type="text" id="dutyEnd" readonly placeholder="Click Calendar"></div>
        <button class="btn" onclick="submitDuty()">Submit Request</button>
      </div>

      <!-- Right Panel: Admin List -->
      <div class="panel hidden" id="adminDutyList">
        <div class="panel-title">All Doctor Requests (This Month)</div>
        <div class="admin-list-container" id="adminDutyListContainer"></div>
      </div>
    </div>

  </div>
</div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbz1m8Pk8t_wopbtFhV06UL9iq4oqXE4h7Q3COkrgTlcUTCLzIAqHozp_qJ5YrFq4lub/exec';
  const ADMIN_PASSWORD = 'admin123'; // 🔐 كلمة مرور المدير الثابتة
  
  let session = null;
  
  // Start calendar at next month
  let currentDate = new Date(); 
  currentDate.setMonth(currentDate.getMonth() + 1);

  // Data Cache
  let allDutyBookings = []; 

  // Range Selection
  let selectionState = 'idle'; 
  let selectedStart = null;
  let selectedEnd = null;

  async function api(action, payload) {
    const res = await fetch(API_URL, { method: 'POST', headers: {'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action, ...payload}) });
    return await res.json();
  }

  // --- LOGIN LOGIC ---
  window.loginAdmin = async () => {
    const pass = document.getElementById('adminPass').value;
    if(pass !== ADMIN_PASSWORD) return alert('Incorrect Manager Password!');
    
    const r = await api('login', { staffNo: 'ADMIN', password: pass });
    if(r.ok) onLoginSuccess(r);
    else alert(r.error);
  };

  window.loginDoctor = async () => {
    const id = document.getElementById('doctorId').value.trim();
    if(!id) return alert('Enter Staff ID');
    
    const r = await api('login', { staffNo: id, password: '' });
    if(r.ok) onLoginSuccess(r);
    else alert(r.error);
  };

  function onLoginSuccess(r) {
    session = r;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appContent').style.display = 'block';
    document.getElementById('displayName').textContent = r.name;

    if(r.role === 'admin') {
      document.getElementById('doctorDutyForm').classList.add('hidden');
      document.getElementById('adminDutyList').classList.remove('hidden');
    } else {
      document.getElementById('doctorDutyForm').classList.remove('hidden');
      document.getElementById('adminDutyList').classList.add('hidden');
    }

    initialLoad();
  }

  window.logout = () => location.reload();

  // --- DATA LOADING ---
  async function initialLoad() {
    // Fetch all duty data once
    const r = await api('getData', { staffNo: session.staffNo, role: session.role, startDate: '2024-01-01', endDate: '2030-12-31', filterType: 'DUTY' });
    if(r.ok) {
      allDutyBookings = r.bookings;
      renderCalendar();
      if(session.role === 'admin') renderAdminList();
    }
  }

  // --- RENDERING ---
  function renderCalendar() {
    const y = currentDate.getFullYear(), m = currentDate.getMonth();
    const gridEl = document.getElementById('calendarGrid');
    
    document.getElementById('monthTitle').textContent = currentDate.toLocaleString('en-US', {month:'long', year:'numeric'});
    
    const firstDay = new Date(y, m, 1).getDay();
    const days = new Date(y, m + 1, 0).getDate();
    const daysArr = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    
    let html = daysArr.map(d => `<div class="day-name">${d}</div>`).join('');
    for(let i=0; i<firstDay; i++) html += `<div></div>`;
    
    for(let d=1; d<=days; d++) {
      let dStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      
      let cls = 'cal-day';
      if (selectedStart === dStr) cls += ' selected-start';
      if (selectedEnd === dStr) cls += ' selected-end';
      if (selectedStart && selectedEnd && dStr > selectedStart && dStr < selectedEnd) cls += ' in-range';

      let events = allDutyBookings.filter(b => b.startDate <= dStr && b.endDate >= dStr);
      let evHtml = '';
      
      if(session.role === 'doctor') {
        events.forEach(e => evHtml += `<div class="event bg-${e.leaveType}">${e.leaveType}</div>`);
      } else {
        events.forEach(e => {
          let initials = e.doctorName.split(' ').filter(n=>n!=='Dr.').map(n=>n[0]).join('').substring(0,2);
          evHtml += `<div class="event bg-${e.leaveType}">${initials}</div>`;
        });
      }

      html += `<div class="${cls}" onclick="clickDay('${dStr}')"><span class="day-num">${d}</span>${evHtml}</div>`;
    }
    gridEl.innerHTML = html;
  }

  window.clickDay = function(dateStr) {
    if(session.role === 'admin') return; // Admin cannot select
    
    if (selectionState === 'idle' || selectionState === 'complete') {
      selectedStart = dateStr;
      selectedEnd = null;
      selectionState = 'startSelected';
      document.getElementById('dutyStart').value = dateStr;
      document.getElementById('dutyEnd').value = '';
    } else if (selectionState === 'startSelected') {
      if (dateStr >= selectedStart) {
        selectedEnd = dateStr;
      } else {
        selectedEnd = selectedStart;
        selectedStart = dateStr;
      }
      selectionState = 'complete';
      document.getElementById('dutyStart').value = selectedStart;
      document.getElementById('dutyEnd').value = selectedEnd;
    }
    renderCalendar();
  };

  function renderAdminList() {
    const container = document.getElementById('adminDutyListContainer');
    const y = currentDate.getFullYear(), m = currentDate.getMonth();
    const monthStr = `${y}-${String(m+1).padStart(2,'0')}`;
    
    // Filter only current month
    const monthBookings = allDutyBookings.filter(b => 
      b.startDate.startsWith(monthStr) || 
      b.endDate.startsWith(monthStr) || 
      (b.startDate <= `${monthStr}-31` && b.endDate >= `${monthStr}-01`)
    );

    if(monthBookings.length === 0) {
      container.innerHTML = '<p style="color:#64748b;">No requests for this month.</p>';
      return;
    }

    const grouped = {};
    monthBookings.forEach(b => {
      if(!grouped[b.staffNo]) grouped[b.staffNo] = { name: b.doctorName, leaves: [] };
      grouped[b.staffNo].leaves.push(b);
    });

    let html = '';
    for(const staffNo in grouped) {
      const doc = grouped[staffNo];
      doc.leaves.sort((a,b) => a.startDate.localeCompare(b.startDate));
      let leaveBadges = doc.leaves.map(l => {
        let dateStr = l.startDate;
        if(l.endDate && l.startDate !== l.endDate) dateStr += ` to ${l.endDate}`;
        return `<span class="leave-badge" style="border-left: 3px solid var(--c-${l.leaveType})">${l.leaveType}: ${dateStr}</span>`;
      }).join('');

      html += `<div class="doctor-group"><div class="doctor-name">${doc.name}</div><div class="doctor-leaves">${leaveBadges}</div></div>`;
    }
    container.innerHTML = html;
  }

  // --- ACTIONS ---
  window.submitDuty = async () => {
    const type = document.getElementById('dutyType').value;
    const start = document.getElementById('dutyStart').value;
    const end = document.getElementById('dutyEnd').value;
    if(!start || !end) return alert('Please select a date range on the calendar first.');
    
    const r = await api('bookLeave', { staffNo: session.staffNo, doctorName: session.name, leaveType: type, startDate: start, endDate: end });
    if(r.ok) { 
      alert('Request submitted successfully!'); 
      selectionState = 'idle'; selectedStart = null; selectedEnd = null;
      document.getElementById('dutyStart').value = '';
      document.getElementById('dutyEnd').value = '';
      await initialLoad(); 
    } else {
      alert(r.error);
    }
  };

  window.changeMonth = (dir) => { 
    currentDate.setMonth(currentDate.getMonth() + dir); 
    renderCalendar();
    if(session.role === 'admin') renderAdminList();
  };
</script>
</body>
</html>
